[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-decline-prediction"
version = "0.1.0"
description = "Synthetic-only transfer-center decline prediction and payer-equity audit"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "statsmodels>=0.14,<1",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "streamlit>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
