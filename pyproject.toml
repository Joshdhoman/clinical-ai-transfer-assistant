[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-transfer-assistant"
version = "0.1.0"
description = "Synthetic-only clinical transfer workflow decision support portfolio"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "streamlit>=1.57,<2", "plotly>=6,<7", "matplotlib>=3.9,<4", "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
